name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Build, vet, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Check formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not gofmt-formatted:"
            echo "$unformatted"
            echo "Run: gofmt -w ."
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -shuffle=on

      - name: Staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false

      - name: Check internal Markdown links
        run: go run ./tools/linkcheck

      - name: No em dashes
        run: |
          pat=$(printf '\xe2\x80\x94')
          unflagged=$(grep -rl --exclude-dir=.git "$pat" --include='*.md' --include='*.go' . || true)
          if [ -n "$unflagged" ]; then
            echo "Em dashes (U+2014) found in: $unflagged"
            echo "Rewrite the sentence; the handbook bans em dashes (see CONTRIBUTING.md)."
            exit 1
          fi
